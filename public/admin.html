<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>JAB Admin</title><link rel="stylesheet" href="/styles.css"></head><body><div class="topbar">JAB Innovations Admin</div><main class="wrap"><section class="panel"><div class="toolbar"><div><h1>Catalog Manager</h1><p class="muted">Edits save permanently to Cloudflare D1.</p></div><button class="btn" onclick="openModal()">+ Add Product</button></div><div id="error" style="color:#fb7185"></div><div id="stats" class="stats"></div><div class="table-wrap"><table class="table"><thead><tr><th>Product</th><th>Cost</th><th>Price</th><th>Quantity</th><th>Visible</th><th>Actions</th></tr></thead><tbody id="rows"></tbody></table></div></section></main><div id="modal" class="modal"><form class="modal-card" onsubmit="submitProduct(event)"><div class="toolbar"><h2 id="modalTitle">Product</h2><button type="button" class="btn secondary" onclick="closeModal()">Close</button></div><div class="grid"><label class="field"><span>Name</span><input id="name" required></label><label class="field"><span>Category</span><input id="category" required></label><label class="field"><span>Cost</span><input id="cost" type="number" min="0" step=".01"></label><label class="field"><span>Price</span><input id="price" type="number" min="0" step=".01"></label><label class="field"><span>Quantity</span><input id="quantity" type="number" min="0"></label><label class="field"><span>Low stock</span><input id="low_stock" type="number" min="0" value="5"></label><label class="field full"><span>Image URL</span><input id="image_url"></label><label class="field full"><span>Description</span><textarea id="description" rows="4"></textarea></label><label class="field full"><span><input id="active" type="checkbox" checked> Visible on storefront</span></label></div><div class="toolbar" style="margin-top:18px"><span></span><button class="btn" type="submit">Save Product</button></div></form></div><div id="toast" class="toast"></div><script src="/admin.js"></script></body></html>
