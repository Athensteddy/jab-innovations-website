<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>JAB Innovations</title><link rel="stylesheet" href="/styles.css"></head><body><div class="topbar">JAB Innovations</div><main class="wrap"><section class="panel"><div class="toolbar"><div><h1>Research Catalog</h1><p class="muted">Live inventory and pricing.</p></div><a class="btn" href="/admin.html">Admin</a></div><div id="catalog" class="stats"></div></section></main><script>fetch('/api/products').then(r=>r.json()).then(p=>{document.querySelector('#catalog').innerHTML=p.filter(x=>+x.active===1).map(x=>`<div class="stat"><strong>${x.name}</strong><span class="muted">$${(+x.price).toFixed(2)} · ${x.quantity} available</span></div>`).join('')})</script></body></html>
